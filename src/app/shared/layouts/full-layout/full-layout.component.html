<div>
  <app-header (menuToggled)="toggle()"></app-header>

  <mat-sidenav-container>

      <app-menu-item [menu]="menu"></app-menu-item>

    <mat-sidenav-content [class.margin-left]="opened">
      <router-outlet></router-outlet>

  </mat-sidenav-container>

  <app-footer></app-footer>
</div>
