<!-- Conteúdo da Mensagem -->
<mat-dialog-content class="!p-6">
  @if (title) {
    <h1>{{ title }}</h1>
  }
  @if (message) {
    <p class="text-slate-700 text-base leading-relaxed">
      {{ message }}
    </p>
  }
</mat-dialog-content>

<!-- Ações (Botões alinhados à direita com espaçamento adequado) -->
<mat-dialog-actions class="!flex !justify-between !gap-3 !px-6 !pb-4 !pt-2">
  <!-- Botão de Cancelar -->
  <button
    mat-button
    mat-dialog-close
    (click)="onCancel()"
    type="button"
    class="!px-4 !py-2 !rounded-xl !border !border-slate-300 !text-slate-700 hover:!bg-slate-100 !font-medium transition-all duration-200 cursor-pointer"
  >
    {{ cancelButtonText || 'Cancelar' }}
  </button>

  <!-- Botão de Confirmação -->
  <button
    mat-flat-button
    color="primary"
    (click)="onConfirmClick()"
    type="button"
    class="!px-5 !py-2 !bg-indigo-600 hover:!bg-indigo-700 !text-white !font-semibold !rounded-xl !shadow-md hover:!shadow-lg !shadow-indigo-100 transition-all duration-200 cursor-pointer"
  >
    {{ confirmButtonText || 'Confirmar' }}
  </button>
</mat-dialog-actions>
