<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-card
    class="max-w-md w-full !rounded-2xl !shadow-xl/30 !overflow-hidden !border !border-slate-200 !bg-white"
  >
    <!-- Cabeçalho -->
    <mat-card-header class="!bg-slate-900 !text-white !p-6 !flex !items-center">
      <img
        src="assets/imgs/brasao.svg"
        alt="Logo TRT"
        class="!w-16 !h-16 !rounded-full !object-cover !p-0 !shadow-md mr-4"
        [dynamicAttr]="isDarkMode"
        dynamicAttrProp="src"
        dynamicAttrValue="assets/imgs/brasao_dark.svg"
      />
      <div>
        <mat-card-title class="!text-xl !font-bold !tracking-tight !text-white">
          Tribunal Regional do Trabalho
        </mat-card-title>
        <mat-card-subtitle class="!text-sm !text-slate-400 !font-medium !mt-1">
          TRT-21 • Natal-RN
        </mat-card-subtitle>
      </div>
    </mat-card-header>

    <!-- Conteúdo do Formulário -->
    <mat-card-content class="!p-8 !space-y-4 !mt-0">
      <!-- Campo Nome / Usuário -->
      <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic" floatLabel="always">
        <mat-label>E-Mail / Usuário</mat-label>
        <input
          matInput
          type="text"
          placeholder="Digite seu usuário"
          formControlName="username"
          inputmode="email"
          cdkFocusInitial
        />
      </mat-form-field>

      <!-- Campo Senha -->
      <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic" floatLabel="always">
        <mat-label>Senha</mat-label>
        <input
          matInput
          type="password"
          placeholder="••••••••"
          formControlName="password"
          inputmode=""
        />
      </mat-form-field>

      <!-- <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic"> -->
      <!-- <mat-label>Senha</mat-label> -->
      <mat-checkbox formControlName="remember" color="#000000">Lembrar dispositivo</mat-checkbox>
      <!-- </mat-form-field> -->

      <!-- Botão de Entrar -->
      <button
        type="submit"
        mat-raised-button
        color="primary"
        class="w-full !py-3 !bg-indigo-600 hover:!bg-indigo-600 !text-white !font-semibold !shadow-lg !shadow-indigo-200 transition-all duration-200"
      >
        <mat-icon>favorite</mat-icon>
        Entrar
      </button>

      <mat-divider class="!mt-2 !mb-6"></mat-divider>

      <button
        type="button"
        matButton="outlined"
        color="primary"
        class="w-full !py-3 bg-slate-500 !border-indigo-600 hover:!border-indigo-700 !font-semibold !shadow-lg transition-all duration-200"
        (click)="logarComGov()"
      >
        <div class="grid grid-flow-col place-items-center justify-items-center-safe gap-2">
          <div>Entrar com</div>
          <div>
            <img src="assets/imgs/gov_br_logo.svg" alt="Logo TRT" class="!h-5" />
          </div>
        </div>
      </button>

      <!-- Rodapé discreto -->
      <p class="text-xs text-center text-slate-400 pt-2">
        Acesso restrito a servidores e colaboradores autorizados.
      </p>
    </mat-card-content>
  </mat-card>
</form>
